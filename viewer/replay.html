<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09111c">
  <title>录像回放与运动诊断</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./replay.js"></script>
</head>
<body class="replay-page">
  <header class="replay-header">
    <div>
      <h1>录像回放</h1>
      <p id="replay-meta" class="hint">选择一份录像文件，或把文件拖到页面上。</p>
    </div>
    <div class="replay-actions">
      <button id="open-file" class="secondary">打开录像</button>
      <a class="secondary download-link" href="../index.html">返回竞技场</a>
    </div>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </header>
  <main id="replay-main" class="replay-main" hidden>
    <section class="replay-stage">
      <canvas id="canvas" aria-label="比赛回放画面"></canvas>
      <div class="transport">
        <button id="play" aria-label="播放或暂停">播放</button>
        <button id="back" title="后退一 Tick" aria-label="后退一 Tick">‹</button>
        <button id="forward" title="前进一 Tick" aria-label="前进一 Tick">›</button>
        <input id="seek" type="range" min="0" value="0" aria-label="时间轴">
        <span id="clock" class="transport-clock">0.00 s</span>
        <select id="speed" aria-label="播放速度">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
        </select>
      </div>
    </section>
    <aside class="panel diagnostics">
      <h2>校验</h2>
      <p id="verify" class="verify-badge">校验中…</p>
      <h2>运动诊断</h2>
      <p class="hint">蓝色是脚本请求的方向，绿色是实际执行的方向。红点是被反向门拦下的 Tick，橙点是撞墙修正，紫点是坦克互推。</p>
      <div id="tracks"></div>
      <div id="metrics"></div>
    </aside>
  </main>
  <div id="notice" role="status" hidden></div>
</body>
</html>
